    <!-- Google AI Studio Preview & Vite HMR WebSocket Guard -->
    <script>
      (function() {
        // Platform Runtime Constraint: "HMR: Disabled. Ignore WebSocket errors."
        // Cloud Run proxies do not support Vite HMR WebSocket upgrades.
        // Prevent uncaught promise rejections from @vite/client line 236: "WebSocket closed without opened."
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (
            msg.includes('WebSocket') ||
            msg.includes('vite') ||
            msg.includes('closed without opened')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          var msg = event.message || '';
          var filename = event.filename || '';
          if (
            filename.includes('@vite/client') ||
            msg.includes('WebSocket') ||
            msg.includes('vite')
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Guard window.WebSocket for vite-hmr and vite-ping on remote proxy domains (*.run.app, ai.studio)
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var isViteHmr =
              (protocols === 'vite-hmr' || protocols === 'vite-ping') ||
              (Array.isArray(protocols) && (protocols.includes('vite-hmr') || protocols.includes('vite-ping'))) ||
              (typeof url === 'string' && (url.includes('token=') && url.includes('vite')));

            var isCloudRunOrRemote =
              window.location.hostname.includes('.run.app') ||
              window.location.hostname.includes('ai.studio') ||
              window.location.hostname.includes('googleusercontent.com');

            if (isViteHmr && isCloudRunOrRemote) {
              var dummy = new EventTarget();
              dummy.url = url;
              dummy.protocol = Array.isArray(protocols) ? protocols[0] : (protocols || '');
              dummy.readyState = OriginalWebSocket.CONNECTING;
              dummy.bufferedAmount = 0;
              dummy.binaryType = 'blob';
              dummy.send = function() {};
              dummy.close = function() {
                dummy.readyState = OriginalWebSocket.CLOSED;
              };

              // Resolve cleanly so @vite/client never rejects with line 236 error
              setTimeout(function() {
                dummy.readyState = OriginalWebSocket.OPEN;
                var openEvent = new Event('open');
                if (typeof dummy.onopen === 'function') dummy.onopen(openEvent);
                dummy.dispatchEvent(openEvent);
              }, 10);

              return dummy;
            }

            try {
              return new OriginalWebSocket(url, protocols);
            } catch (err) {
              var fallback = new EventTarget();
              fallback.readyState = OriginalWebSocket.CLOSED;
              fallback.send = function() {};
              fallback.close = function() {};
              return fallback;
            }
          };

          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }
      })();
    </script>
