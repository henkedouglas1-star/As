name: TipZeMe security branch checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [security/tipzeme-hardening]
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run lint
      - name: Payment tests
        run: npm test
      - name: Production build
        run: npm run build
